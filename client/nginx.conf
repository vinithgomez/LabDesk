# The PWA's static files, plus /api proxied to the API container, so the
# refresh cookie is first-party and no CORS is involved.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Always revalidate the app shell and service worker, so a new build is
  # picked up; hashed assets can be cached forever.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # Client-side routes (/scan, /checkin, /analytics, ...) all load the app.
  location / { try_files $uri /index.html; }
}
